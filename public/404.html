<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="path-recovery" content="GitHub Pages project path recovery">
    <title>Hay Day Wiki Archive | Page not found</title>
    <style>body{font-family:system-ui,sans-serif;max-width:48rem;margin:8rem auto;padding:1rem;background:#fbf8f0;color:#21352b}a{color:#28724b}</style>
  </head>
  <body>
    <main>
      <h1>That archive path is not available</h1>
      <p>The requested path could not be found in this published snapshot.</p>
      <p><a href="/hay-day-wiki-archive/">Return to the archive home</a></p>
    </main>
    <script>
      (function recoverProjectPath() {
        const base = '/hay-day-wiki-archive/';
        const requested = window.location.pathname;
        const candidate = requested.startsWith(base) ? requested.slice(base.length).replace(/^\/+|\/+$/g, '') : '';
        if (!candidate || candidate === '404.html') return;
        const suffix = window.location.search + window.location.hash;
        const direct = base + candidate + '/index.html' + suffix;
        function publishedRoute(route) { return String(route).replaceAll('%', '~'); }
        function go(target) {
          fetch(target, { method: 'HEAD', cache: 'no-store' }).then(function (response) {
            if (response.ok) window.location.replace(target);
          }).catch(function () { /* The visible recovery link remains available. */ });
        }
        fetch(base + 'archive/articles.json', { cache: 'no-store' }).then(function (response) {
          if (!response.ok) throw new Error('article index unavailable');
          return response.json();
        }).then(function (articles) {
          const wanted = decodeURIComponent(candidate).replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase();
          const match = Object.values(articles).find(function (article) {
            if (!article || typeof article !== 'object') return false;
            const title = String(article.title || '').toLowerCase();
            const route = publishedRoute(String(article.route || '')).replace(/^\/+|\/+$/g, '').toLowerCase();
            return route === candidate.toLowerCase() || title === wanted || route.endsWith('/' + candidate.toLowerCase());
          });
          if (match && match.route) go(base + publishedRoute(String(match.route)).replace(/^\/+/, '') + '/index.html' + suffix);
          else go(direct);
        }).catch(function () { go(direct); });
      }());
    </script>
  </body>
</html>
