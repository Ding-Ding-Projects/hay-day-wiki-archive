name: Build Pages release

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Install declared dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Vinext output
        run: npm run build
      - name: Build static Pages output
        run: node scripts/build-pages.mjs
      - name: Check static Pages output
        run: node scripts/check-pages-output.mjs
      - name: Count surviving source lines
        run: node scripts/count-lines.mjs > line-count.md
      - name: Upload Pages bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - name: Upload release inputs
        uses: actions/upload-artifact@v4
        with:
          name: pages-release-inputs
          path: |
            dist/pages
            line-count.md
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages bundle
        id: deployment
        uses: actions/deploy-pages@v4
