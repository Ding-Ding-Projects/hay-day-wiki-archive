name: Build Pages release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Install declared dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Vinext output
        run: npm run build
      - name: Build static Pages output
        run: node scripts/build-pages.mjs
      - name: Check static Pages output
        run: node scripts/check-pages-output.mjs
      - name: Count surviving source lines
        run: node scripts/count-lines.mjs > line-count.md
      - name: Upload Pages bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - name: Upload release inputs
        uses: actions/upload-artifact@v4
        with:
          name: pages-release-inputs
          path: |
            dist/pages
            line-count.md
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages bundle
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    steps:
      - name: Download release inputs
        uses: actions/download-artifact@v4
        with:
          name: pages-release-inputs
          path: release-inputs
      - name: Package static Pages bundle
        run: tar -czf hay-day-wiki-archive-pages.tar.gz -C release-inputs/dist pages
      - name: Publish one unique release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          tag="pages-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "Static Pages release for ${GITHUB_SHA}."
            echo
            echo "The published bundle is a static website. No installer is attached because Squirrel.Windows packaging is not implemented for this project."
            echo
            echo "Line count command: node scripts/count-lines.mjs"
            cat release-inputs/line-count.md
          } > release-notes.md
          gh release create "$tag" hay-day-wiki-archive-pages.tar.gz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Pages ${tag}" --notes-file release-notes.md
